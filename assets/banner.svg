<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080b11" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="wave-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&amp;display=swap');
      
      .text-title {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .text-subtitle {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 500;
        font-size: 16px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .text-badge {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 12px;
        fill: #38bdf8;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      /* Animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes beaconPulse {
        0% { r: 4px; opacity: 1; }
        100% { r: 18px; opacity: 0; }
      }

      .animated-float-1 { animation: floatSlow 6s ease-in-out infinite; }
      .animated-float-2 { animation: floatFast 5s ease-in-out infinite 1s; }
      .animated-float-3 { animation: floatSlow 7s ease-in-out infinite 2s; }
      .animated-pulse { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }

      .beacon-ring {
        animation: beaconPulse 2s ease-out infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-gradient)" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <rect width="1200" height="420" fill="url(#grid)" rx="16" opacity="0.7" />

  <!-- Animated Glowing Orbs (Background) -->
  <circle cx="200" cy="100" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="animated-pulse" />
  <circle cx="1000" cy="300" r="200" fill="#06b6d4" opacity="0.12" filter="url(#glow)" class="animated-pulse" style="animation-delay: 2s;" />

  <!-- Dynamic Wave & Chart Lines (Middle Background Layer) -->
  <g opacity="0.85">
    <!-- Area under graph -->
    <path d="M 50 320 Q 250 260 450 310 T 850 250 T 1150 280 L 1150 380 L 50 380 Z" fill="url(#wave-fill)" />
    <!-- Wave line -->
    <path d="M 50 320 Q 250 260 450 310 T 850 250 T 1150 280" fill="none" stroke="url(#wave-gradient)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Animated pulse node 1 -->
    <g transform="translate(450, 310)">
      <circle cx="0" cy="0" r="6" fill="#38bdf8" />
      <circle cx="0" cy="0" class="beacon-ring" fill="none" stroke="#38bdf8" stroke-width="2" />
    </g>
    <!-- Animated pulse node 2 -->
    <g transform="translate(850, 250)">
      <circle cx="0" cy="0" r="6" fill="#a855f7" />
      <circle cx="0" cy="0" class="beacon-ring" fill="none" stroke="#a855f7" stroke-width="2" style="animation-delay: 1s;" />
    </g>
  </g>

  <!-- Dynamic Background Floating Metric Cards & Pills (Placed in side/bottom area so they stay outside main title area) -->
  <!-- Floating Pill 1: LCP Badge (Top Right) -->
  <g class="animated-float-1" transform="translate(820, 50)" filter="url(#shadow)">
    <rect width="160" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.9" />
    <circle cx="24" cy="21" r="7" fill="#10b981" />
    <text x="40" y="26" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">LCP: 0.82s</text>
    <text x="112" y="26" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#10b981">GOOD</text>
  </g>

  <!-- Floating Pill 2: INP Badge (Right Middle) -->
  <g class="animated-float-2" transform="translate(970, 120)" filter="url(#shadow)">
    <rect width="170" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.9" />
    <circle cx="24" cy="21" r="7" fill="#3b82f6" />
    <text x="40" y="26" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">INP: 38ms</text>
    <text x="116" y="26" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#38bdf8">FAST</text>
  </g>

  <!-- Floating Pill 3: CLS Badge (Bottom Right) -->
  <g class="animated-float-3" transform="translate(880, 290)" filter="url(#shadow)">
    <rect width="160" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.9" />
    <circle cx="24" cy="21" r="7" fill="#a855f7" />
    <text x="40" y="26" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">CLS: 0.004</text>
    <text x="118" y="26" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#c084fc">OPT</text>
  </g>

  <!-- Floating Mini Live Telemetry Card (Far Right) -->
  <g class="animated-float-1" transform="translate(670, 280)" filter="url(#shadow)" style="animation-delay: 1.5s;">
    <rect width="180" height="74" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" opacity="0.95" />
    <text x="16" y="26" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#94a3b8">Active Sessions</text>
    <text x="16" y="54" font-family="'Inter', sans-serif" font-weight="800" font-size="22" fill="#ffffff">124.8k</text>
    <path d="M 115 48 Q 125 35 135 42 T 155 30 T 168 36" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="168" cy="36" r="3" fill="#10b981" />
  </g>

  <!-- FOREGROUND TEXT LAYER (Ensured to be at the very top, foreground, clear & readable, no obscuration) -->
  <g transform="translate(70, 0)">
    <!-- Dark subtle backdrop blur card behind main text for guaranteed legibility -->
    <rect x="0" y="70" width="580" height="260" rx="16" fill="#0b0f19" opacity="0.4" />

    <!-- Badge Header -->
    <g transform="translate(20, 110)">
      <rect width="285" height="28" rx="14" fill="url(#primary-glow)" opacity="0.2" />
      <rect width="285" height="28" rx="14" fill="none" stroke="url(#primary-glow)" stroke-width="1.2" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" />
      <text x="28" y="18" class="text-badge">⚡ FRONTEND OBSERVABILITY</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(20, 175)">
      <text class="text-title" filter="url(#shadow)">
        Real User Monitoring
      </text>
      <!-- Sub Title Line 2 Accent -->
      <text y="52" class="text-title" fill="url(#primary-glow)" filter="url(#shadow)">
        &amp; RUM Telemetry
      </text>
    </g>

    <!-- Subtitle / Bullet Highlights -->
    <g transform="translate(20, 275)">
      <text class="text-subtitle">
        Core Web Vitals <tspan fill="#38bdf8">•</tspan> Session Replay <tspan fill="#a855f7">•</tspan> Error Analytics <tspan fill="#ec4899">•</tspan> Telemetry
      </text>
    </g>

    <!-- Feature tags -->
    <g transform="translate(20, 305)">
      <rect x="0" y="0" width="90" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="45" y="16" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#94a3b8">Open Source</text>

      <rect x="100" y="0" width="85" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="142.5" y="16" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#94a3b8">SaaS Tools</text>

      <rect x="195" y="0" width="95" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="242.5" y="16" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#94a3b8">Performance</text>
    </g>
  </g>
</svg>
