<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <radialGradient id="cyan-orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purple-orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    <![CDATA[
    @keyframes pulseWave {
      0% { stroke-dashoffset: 1200; opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { stroke-dashoffset: 0; opacity: 0.3; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes beaconPulse {
      0% { r: 4px; opacity: 1; }
      100% { r: 14px; opacity: 0; }
    }
    .rum-wave {
      stroke-dasharray: 1200;
      animation: pulseWave 8s linear infinite;
    }
    .card-float-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-float-2 { animation: floatCard2 7s ease-in-out infinite; }
    .pulse-ring { animation: beaconPulse 2.5s ease-out infinite; }
    ]]>
  </style>

  <!-- Base Layer: Dark Canvas & Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="160" cy="120" r="220" fill="url(#cyan-orb)" />
  <circle cx="1040" cy="300" r="240" fill="url(#purple-orb)" />

  <!-- Dynamic Waveforms -->
  <g opacity="0.45">
    <path d="M 0 320 Q 200 240, 400 300 T 800 260 T 1200 310 L 1200 420 L 0 420 Z" fill="#0284c7" opacity="0.08" />
    <path d="M 0 320 Q 200 240, 400 300 T 800 260 T 1200 310" fill="none" stroke="url(#cyan-blue)" stroke-width="3" class="rum-wave" />
    <path d="M 0 360 Q 250 290, 550 340 T 950 280 T 1200 340" fill="none" stroke="url(#purple-pink)" stroke-width="2.5" class="rum-wave" style="animation-duration: 11s;" />
  </g>

  <!-- Side Metric Cards -->
  <!-- Top Left Card -->
  <g class="card-float-1" transform="translate(60, 50)">
    <rect width="180" height="40" rx="20" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
    <circle cx="22" cy="20" r="6" fill="#10b981" />
    <circle cx="22" cy="20" r="6" fill="#10b981" class="pulse-ring" />
    <text x="38" y="25" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">LCP 1.2s • Good</text>
  </g>

  <!-- Top Right Card -->
  <g class="card-float-2" transform="translate(960, 50)">
    <rect width="180" height="40" rx="20" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
    <circle cx="22" cy="20" r="6" fill="#06b6d4" />
    <text x="38" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Live Sessions: 99.8%</text>
  </g>

  <!-- Bottom Left Card -->
  <g class="card-float-2" transform="translate(70, 330)">
    <rect width="160" height="38" rx="19" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">INP: 45ms (Fast)</text>
  </g>

  <!-- Bottom Right Card -->
  <g class="card-float-1" transform="translate(970, 330)">
    <rect width="170" height="38" rx="19" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="24" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Error Free: 99.9%</text>
  </g>

  <!-- FOREGROUND MAIN HEADER PANEL -->
  <g transform="translate(600, 210)" text-anchor="middle">
    <!-- Solid Dark Backdrop Panel -->
    <rect x="-430" y="-105" width="860" height="205" rx="20" fill="#0f172a" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.5" />

    <!-- Badge -->
    <g transform="translate(0, -70)">
      <rect x="-120" y="-14" width="240" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2" />
      <text x="0" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">FRONTEND OBSERVABILITY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="-8" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
      Awesome Real User Monitoring
    </text>

    <!-- Subtitle -->
    <text x="0" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">
      Curated SaaS Platforms, Self-Hosted RUM Tools &amp; Open-Source Telemetry
    </text>

    <!-- Category Highlights -->
    <g transform="translate(0, 72)">
      <text x="0" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
        Core Web Vitals &nbsp;&bull;&nbsp; Session Replay &nbsp;&bull;&nbsp; Browser Telemetry &nbsp;&bull;&nbsp; Privacy-First
      </text>
    </g>
  </g>
</svg>
